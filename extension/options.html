<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPP Sync Options</title><link rel="stylesheet" href="style.css"></head><body class="options"><main><p class="eyebrow">UNIVERSAL JOBS BOARD</p><h1>CPP Sync Options</h1><p>These settings remain on this browser profile and are never synced through Chrome.</p><form id="form"><label>Dashboard URL<input id="dashboardUrl" type="url" placeholder="http://localhost:3000" required></label><label>CPP extension API key<input id="extensionKey" type="password" autocomplete="off" required></label><button>Save and grant access</button><p id="status" role="status"></p></form><aside>Only the configured dashboard origin is granted at runtime. The extension can read cookies only from <code>lbs.12twenty.com</code>.</aside></main><script src="options.js" type="module"></script></body></html>
